name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller

      - name: Download FFmpeg binaries
        run: python scripts\ensure_ffmpeg.py

      - name: Build executable
        run: .\build_exe.bat

      - name: Create portable archive
        shell: pwsh
        run: Compress-Archive -Path dist\SaveYourStorage\* -DestinationPath SaveYourStorage-${{ github.ref_name }}-win-x64.zip

      - name: Build MSIX
        shell: pwsh
        run: .\packaging\build_msix.ps1 -Version ${{ github.ref_name }}

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            SaveYourStorage-${{ github.ref_name }}-win-x64.zip
            packaging\output\SaveYourStorage.msix
